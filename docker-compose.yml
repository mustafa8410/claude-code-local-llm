# claude-local-llm
#
#   docker compose up -d            # GPU (NVIDIA)
#   docker compose --profile cpu up -d   # no GPU
#
# Then:
#   eval "$(curl -s 'http://localhost:8787/admin/client-env?format=sh' | grep ^export)"
#   claude --tools "Read,Edit,Grep,Glob,Bash"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: claude-local-llm:latest
    ports:
      - "8787:8787"
    volumes:
      # Model weights. Named volume so `docker compose pull` does not cost a re-download.
      - llm-models:/models
      # Edit the catalog without rebuilding.
      - ./config/models.yaml:/app/config/models.yaml:ro
    environment:
      # Serve unrecognised model ids from whatever is already loaded. Claude Code's
      # background slot uses a real Anthropic id that a local catalog never contains,
      # so without this every side task evicts the main model and evicts it back.
      BACKGROUND_STRATEGY: reuse-primary
      # Unload after 15 min idle to give the GPU back.
      IDLE_TTL_SECONDS: "900"
      # full | coding | analysis | comma-separated tool list.
      # Prefer `claude --tools "..."` client-side; this is for when you cannot change
      # the launch command.
      TOOL_PROFILE: "${TOOL_PROFILE:-full}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Tell the gateway its real RAM budget when detection cannot. It reads the cgroup
      # limit, so `mem_limit` below is honoured automatically - but under Docker Desktop
      # on Windows the ceiling that actually binds is the WSL2 VM's share of host RAM,
      # which neither the cgroup nor os.totalmem() reports. Set this to that number.
      # MEMORY_BUDGET_GB: "8"
    # Uncomment to cap the container. The gateway reads the limit and marks models that
    # no longer fit as unavailable, instead of loading one and being OOM-killed.
    # mem_limit: 8g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Same Dockerfile, CPU base image, no GPU reservation. Usable, but expect
  # single-digit tokens/sec - which is why the gateway refuses to start without a GPU
  # unless ALLOW_CPU is set explicitly.
  gateway-cpu:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/ggml-org/llama.cpp:server
    image: claude-local-llm:cpu
    ports:
      - "8787:8787"
    volumes:
      - llm-models:/models
      - ./config/models.yaml:/app/config/models.yaml:ro
    environment:
      ALLOW_CPU: "1"
      BACKGROUND_STRATEGY: reuse-primary
      IDLE_TTL_SECONDS: "900"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    restart: unless-stopped

volumes:
  llm-models:
